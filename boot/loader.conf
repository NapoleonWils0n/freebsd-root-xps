#===============================================================================
# loader.conf
#===============================================================================


#===============================================================================
# general settings
#===============================================================================

aesni_load="YES"
geom_eli_load="YES"
kern.geom.label.disk_ident.enable="0"
kern.geom.label.gptid.enable="0"
cryptodev_load="YES"
zfs_load="YES"


#===============================================================================
# nullfs tmpfs for poudriere
#===============================================================================

nullfs_load="YES"


#===============================================================================
# audio
#===============================================================================

snd_hda_load="YES"
snd_uaudio_load="YES"


#===============================================================================
# coretemp
#===============================================================================

acpi_video_load="YES"
coretemp_load="YES"


#===============================================================================
# async i/o
#===============================================================================

aio_load="YES"


#===============================================================================
# cuse audio for virtual_oss
#===============================================================================

cuse_load="YES"


#===============================================================================
# mixertui
#===============================================================================

sysctlinfo_load="YES"
sysctlbyname_improved_load="YES"


#===============================================================================
# usb keyboard multimedia keys
#===============================================================================

usbhid_load="YES"


#===============================================================================
# setfibs
#===============================================================================

net.fibs=2


#===============================================================================
# poudriere maxdsiz for building packages
#===============================================================================

kern.maxdsiz="64G"


#===============================================================================
# EnableGpuFirmware
#===============================================================================

hw.nvidia.registry.EnableGpuFirmware=1
